<title>Brain Terminal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============ Brain Terminal — Deepvue-inspired dark terminal ============ */
/* Deliberately single-theme: a dark trading terminal over a gradient loop.  */
:root{
  --ground:#12142a;
  --panel:rgba(13,15,22,.84);
  --panel-solid:#101319;
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.14);
  --ink:#e9ecf5;
  --ink-2:#9aa3b8;
  --ink-3:#6a7490;
  --pos:#4d8dff;        /* validated mark blue  */
  --neg:#e64f95;        /* validated mark pink  */
  --pos-t:#7dabff;      /* text tint of pos     */
  --neg-t:#f478b0;      /* text tint of neg     */
  --amber:#bd8420;      /* validated mark amber */
  --amber-t:#e8b64c;
  --radius:14px;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--ink);background:var(--ground);
  min-height:100vh;font-size:14px;line-height:1.45;
}
/* ---- the gradient loop ---- */
.bgwrap{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--ground)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.blob.b1{width:62vw;height:62vw;left:-14vw;top:-22vw;background:#2447c7;animation:drift1 26s ease-in-out infinite alternate}
.blob.b2{width:52vw;height:52vw;right:-12vw;top:-8vw;background:#6d28d9;animation:drift2 31s ease-in-out infinite alternate}
.blob.b3{width:58vw;height:58vw;left:18vw;bottom:-30vw;background:#d6367f;animation:drift3 24s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(9vw,7vh) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-8vw,10vh) scale(.92)}}
@keyframes drift3{from{transform:translate(0,0) scale(1)}to{transform:translate(-10vw,-9vh) scale(1.18)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

/* ---- chrome ---- */
.shell{max-width:1240px;margin:0 auto;padding:20px 20px 56px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:17px;font-weight:700;letter-spacing:.4px}
.brand span{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;font-weight:600}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  font-family:var(--mono);font-size:11px;font-weight:500;border:1px solid var(--line-2);color:var(--ink-2)}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.bull{color:#8fd0a9;border-color:rgba(110,200,150,.35)}
.pill.bull .dot{background:#57b57f}
.pill.bear{color:var(--neg-t);border-color:rgba(230,79,149,.4)}
.pill.bear .dot{background:var(--neg)}
.pill.synth{color:var(--amber-t);border-color:rgba(189,132,32,.45);cursor:help}
.pill.synth .dot{background:var(--amber)}
.asof{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.runscan{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:#06121f;background:linear-gradient(180deg,#6fb0ff,#4d8dff);border:0;border-radius:9px;
  padding:7px 15px;cursor:pointer;box-shadow:0 2px 12px rgba(77,141,255,.4);transition:transform .1s}
.runscan:hover{transform:translateY(-1px)}
.runscan:active{transform:translateY(0)}
.runscan.busy{opacity:.7;pointer-events:none}
.runscan.busy::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;
  border:2px solid #06121f;border-top-color:transparent;border-radius:50%;
  animation:spin .6s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.runscan.busy::before{animation:none}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);z-index:70;
  background:#0b0d13;border:1px solid var(--line-2);border-radius:10px;padding:10px 18px;
  font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--pos-t)}
nav.tabs{display:flex;gap:4px;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;
  padding:4px;background:var(--panel);backdrop-filter:blur(14px);width:max-content;max-width:100%;overflow-x:auto}
nav.tabs button{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-2);
  background:none;border:0;border-radius:8px;padding:7px 15px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{background:rgba(77,141,255,.16);color:var(--ink)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--pos);outline-offset:1px}

/* ---- panels ---- */
.grid{display:grid;gap:14px}
.panel{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 18px;box-shadow:0 12px 34px rgba(0,0,0,.35)}
.panel h2{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.panel h2 .sub{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3);font-size:11px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cols2{grid-template-columns:1fr 1fr}
@media(max-width:880px){.cols2{grid-template-columns:1fr}}

/* ---- numerals ---- */
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.pos{color:var(--pos-t)}.neg{color:var(--neg-t)}.flat{color:var(--ink-2)}
.big{font-size:24px;font-weight:600;letter-spacing:-.01em}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:6px}
.chip.pos{background:rgba(77,141,255,.15)}
.chip.neg{background:rgba(230,79,149,.15)}
.chip.flat{background:rgba(255,255,255,.06)}

/* ---- index tiles ---- */
.tile .row1{display:flex;align-items:baseline;gap:10px}
.tile .sym{font-weight:700;font-size:15px}
.tile canvas{width:100%;height:56px;display:block;margin-top:10px}
.tile .meta{display:flex;gap:14px;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* ---- tracker bars ---- */
.seg{display:inline-flex;gap:2px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:8px;padding:2px;margin-left:auto}
.seg button{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-3);
  background:none;border:0;border-radius:6px;padding:3px 9px;cursor:pointer}
.seg button.on{background:rgba(77,141,255,.2);color:var(--ink)}
.trk{display:flex;flex-direction:column;gap:2px}
.trow{display:grid;grid-template-columns:128px 1fr 58px;align-items:center;gap:10px;
  padding:2.5px 6px;border-radius:7px;cursor:default}
.trow:hover{background:rgba(255,255,255,.045)}
.trow .lbl{font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .barbox{position:relative;height:13px}
.trow .bar{position:absolute;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.trow .bar.p{background:var(--pos)}
.trow .bar.n{background:var(--neg)}
.trow .val{text-align:right}

/* ---- tables ---- */
.twrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);text-align:right;padding:7px 9px;border-bottom:1px solid var(--line-2);
  white-space:nowrap;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th:hover{color:var(--ink-2)}
th .arr{color:var(--pos-t)}
td{padding:6.5px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr:hover{background:rgba(255,255,255,.045)}
tbody tr{cursor:pointer}
tbody tr:last-child td{border-bottom:0}
td .sym{font-weight:700;font-size:12.5px}
td .sect{color:var(--ink-3);font-size:11px}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12)}
.dots i.on{background:var(--pos)}
.count{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:10px}

/* ---- toolbar ---- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=text],.toolbar input[type=number],.toolbar select{
  font-family:var(--mono);font-size:12px;color:var(--ink);background:rgba(255,255,255,.055);
  border:1px solid var(--line-2);border-radius:8px;padding:6px 10px}
.toolbar input[type=text]{width:150px}
.toolbar input[type=number]{width:74px}
.toolbar input::placeholder{color:var(--ink-3)}
.toolbar label.ck{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);cursor:pointer}
.toolbar select{cursor:pointer}
.toolbar .reset{font-size:11.5px;color:var(--ink-3);background:none;border:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.toolbar .reset:hover{color:var(--ink-2)}

/* ---- drawer ---- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);z-index:40;
  background:rgba(11,13,19,.97);border-left:1px solid var(--line-2);padding:20px 22px;
  overflow-y:auto;transform:translateX(102%);transition:transform .22s ease}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer.open{transform:none}
.drawer .close{position:absolute;top:14px;right:14px;background:none;border:1px solid var(--line-2);
  color:var(--ink-2);border-radius:8px;font-size:13px;padding:3px 10px;cursor:pointer}
.drawer h3{margin:2px 0 2px;font-size:22px}
.drawer .dsub{color:var(--ink-3);font-size:12px;margin-bottom:12px}
.drawer canvas{width:100%;display:block}
.chartbar{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
.chartbar .seg{margin-left:0}
.chartbar .lvltoggle{margin-left:auto;font-size:11px;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.zoomseg{display:inline-flex;align-items:center;gap:2px}
.zoomseg button{width:24px;height:24px;font-size:15px;line-height:1;font-family:var(--mono);
  color:var(--ink-1);background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;cursor:pointer;padding:0}
.zoomseg button:hover:not(:disabled){border-color:var(--pos)}
.zoomseg button:disabled{opacity:.35;cursor:default}
.zoomseg #zoomlbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:34px;text-align:center}
.volsheet{margin-top:12px;border-top:1px solid var(--line-1)}
.volsheet>summary{cursor:pointer;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);padding:8px 0 6px;list-style:none;user-select:none}
.volsheet>summary::-webkit-details-marker{display:none}
.volsheet>summary::before{content:"▸ ";color:var(--ink-3)}
.volsheet[open]>summary::before{content:"▾ "}
.volsheet-wrap{max-height:220px;overflow:auto}
#dvoltbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
#dvoltbl th{position:sticky;top:0;background:var(--panel);color:var(--ink-3);font-weight:600;
  text-align:right;padding:5px 8px;border-bottom:1px solid var(--line-2)}
#dvoltbl th:first-child{text-align:left}
#dvoltbl td{padding:4px 8px;border-bottom:1px solid var(--line-1);color:var(--ink-2)}
#dvoltbl td.num{text-align:right}
#dvoltbl td.up{color:var(--pos-t)} #dvoltbl td.dn{color:var(--neg-t)}
#dvoltbl tbody tr:hover{background:var(--panel-2)}
.pricewrap{position:relative}
#dprice{height:180px}
#dvol{height:52px;margin-top:2px}
.chartlegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.chartlegend i{display:inline-block;width:14px;height:0;border-top-width:2px;border-top-style:solid;vertical-align:3px;margin-right:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:12.5px;margin-top:12px}
.kv .k{color:var(--ink-2)}
.kv .v{font-family:var(--mono);text-align:right}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:11px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:2px 9px}

/* ---- scanner ---- */
.cands{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cand .chead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.cand .chead .sym{font-size:17px;font-weight:700}
.cand .chead .score{margin-left:auto;font-family:var(--mono);font-size:19px;font-weight:600;color:var(--pos-t)}
.comp{display:grid;grid-template-columns:118px 1fr 34px;gap:8px;align-items:center;
  font-size:11px;color:var(--ink-2);padding:2px 0}
.comp .cb{height:8px;border-radius:0 3px 3px 0;background:var(--pos);min-width:2px;opacity:.85}
.comp .cv{font-family:var(--mono);text-align:right;color:var(--ink-2)}
.statebadge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 8px;border-radius:6px;
  background:rgba(232,182,76,.13);color:var(--amber-t)}
.statebadge.breakout{background:rgba(77,141,255,.16);color:var(--pos-t)}
.scanrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.scanhint{font-size:12px;color:var(--ink-3);max-width:640px}
.scanhint b{color:var(--pos-t)}
/* scanner: breakout leaders + approaching */
.scangrid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
@media(max-width:900px){.scangrid{grid-template-columns:1fr}}
.leadwrap{overflow-x:auto;margin-top:12px}
.leadtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.leadtbl th{text-align:right;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.leadtbl th:nth-child(2){text-align:left}
.leadtbl td{padding:8px 10px;border-bottom:1px solid var(--line-1);text-align:right;white-space:nowrap;font-family:var(--mono)}
.leadtbl td.rank{color:var(--ink-3);font-size:11px}
.leadtbl td:nth-child(2){text-align:left;font-family:var(--sans)}
.leadtbl td .sym{font-size:14px;font-weight:700}
.leadtbl td .lsec{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);margin-top:1px}
.leadtbl td.up{color:var(--pos-t)} .leadtbl td.dn{color:var(--neg-t)}
.leadtbl tbody tr{cursor:pointer}
.leadtbl tbody tr:hover{background:var(--panel-2)}
.rsbadge{display:inline-block;min-width:30px;padding:2px 6px;border-radius:6px;font-family:var(--mono);
  font-size:11px;font-weight:700;color:#06121f;background:linear-gradient(180deg,#6fb0ff,#4d8dff)}
.rsbadge.sm{min-width:26px;font-size:10px;padding:1px 5px}
canvas.lspark{width:72px;height:26px;display:block}
.applist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.approw{border:1px solid var(--line-1);border-radius:10px;padding:9px 11px;cursor:pointer;transition:border-color .1s}
.approw:hover{border-color:var(--pos)}
.approw .atop{display:flex;align-items:center;gap:8px}
.approw .atop .sym{font-size:14px;font-weight:700}
.approw .atop .rsbadge{margin-left:auto}
.approw .asub{font-size:10.5px;color:var(--ink-3);margin:2px 0 6px}
.approw .ameta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.approw .ameta .up{color:var(--pos-t)} .approw .ameta .dn{color:var(--neg-t)}

/* ---- research ---- */
.hyp{border-bottom:1px solid var(--line);padding:10px 2px}
.hyp:last-child{border-bottom:0}
.hyp .q{font-weight:600;font-size:13.5px}
.hyp .s{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.hyp .hmeta{display:flex;gap:8px;margin-top:6px}
.badge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;
  padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--ink-2)}
.badge.open{background:rgba(77,141,255,.14);color:var(--pos-t)}
.note{font-size:12px;color:var(--ink-3);line-height:1.55;margin-top:10px}

/* ---- stat tiles ---- */
.stat .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat .k{font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.meter{height:7px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pos);border-radius:4px}

/* ---- tooltip ---- */
#tip{position:fixed;z-index:60;pointer-events:none;background:#0b0d13;border:1px solid var(--line-2);
  border-radius:10px;padding:9px 12px;font-size:11.5px;box-shadow:0 10px 28px rgba(0,0,0,.5);
  max-width:280px;display:none}
#tip .th{font-weight:700;font-size:12.5px;margin-bottom:5px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);padding:1px 0}
#tip .tr span:first-child{color:var(--ink-2);font-family:var(--sans)}
.notice{border:1px solid rgba(189,132,32,.45);background:rgba(189,132,32,.09);
  border-radius:12px;padding:10px 14px;font-size:12px;color:var(--ink-2);
  line-height:1.55;margin-bottom:14px}
.notice b{color:var(--amber-t)}
.notice a{color:var(--pos-t)}
.realtag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;
  color:var(--amber-t);text-transform:uppercase}
.enginetag{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:4px}
.enginetag a{color:var(--ink-3)}
.footer{margin-top:22px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.footer b{color:var(--ink-2)}
</style>

<div class="bgwrap"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="tip"></div>

<div class="shell">
  <header class="topbar">
    <div class="brand"><b>BRAIN TERMINAL</b><span>AI Trading Brain</span></div>
    <span class="spacer"></span>
    <button id="runscan" class="runscan">▶ RUN SCAN</button>
    <span id="regimepill"></span>
    <span id="synthpill"></span>
    <span class="asof" id="asof"></span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="notice"></div>
  <main id="view"></main>
  <div class="drawer" id="drawer"></div>
</div>

<script>
const SNAP = __SNAPSHOT_JSON__;

/* ---------------- utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('bt.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('bt.'+k, JSON.stringify(v)); }catch(e){} },
};
function fmtPct(v, signed=true){
  if(v===null||v===undefined) return '<span class="num flat">—</span>';
  const cls = v>0.004?'pos':(v<-0.004?'neg':'flat');
  const s = (signed&&v>0?'+':'')+v.toFixed(2)+'%';
  return `<span class="num ${cls}">${s}</span>`;
}
function fmtNum(v, dp=2){
  if(v===null||v===undefined) return '<span class="num flat">—</span>';
  return `<span class="num">${Number(v).toFixed(dp)}</span>`;
}
function chip(v){
  if(v===null||v===undefined) return '<span class="chip flat">—</span>';
  const cls = v>0.004?'pos':(v<-0.004?'neg':'flat');
  return `<span class="chip ${cls} num">${v>0?'+':''}${v.toFixed(2)}%</span>`;
}
const TF = [['d1','Today'],['w1','1W'],['m1','1M'],['m3','3M'],['ytd','YTD']];

/* ---------------- tooltip ---------------- */
const tip = $('#tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.style.display='block';
  const r = tip.getBoundingClientRect();
  let left = x+14, top = y+14;
  if(left + r.width > innerWidth-8) left = x - r.width - 12;
  if(top + r.height > innerHeight-8) top = y - r.height - 12;
  tip.style.left = left+'px'; tip.style.top = top+'px';
}
function hideTip(){ tip.style.display='none'; }

/* ---------------- sparklines ---------------- */
function drawSpark(canvas, values, opts={}){
  const dpr = devicePixelRatio||1;
  const w = canvas.clientWidth||260, h = canvas.clientHeight||56;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  if(!values || values.length<2) return;
  const min = Math.min(...values), max = Math.max(...values), span = (max-min)||1;
  const pad = 3;
  const X = i => pad + i*(w-2*pad)/(values.length-1);
  const Y = v => h-pad - (v-min)*(h-2*pad)/span;
  const up = values[values.length-1] >= values[0];
  const col = up ? '#4d8dff' : '#e64f95';
  // area fill
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0, up?'rgba(77,141,255,.22)':'rgba(230,79,149,.22)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.moveTo(X(0), Y(values[0]));
  values.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.lineTo(X(values.length-1),h); ctx.lineTo(X(0),h); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  // line
  ctx.beginPath(); ctx.moveTo(X(0), Y(values[0]));
  values.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
  // endpoint
  ctx.beginPath(); ctx.arc(X(values.length-1), Y(values[values.length-1]), 3, 0, 7);
  ctx.fillStyle=col; ctx.fill();
  ctx.strokeStyle='#101319'; ctx.lineWidth=2; ctx.stroke();
  canvas._geom = {X, Y, values, dates:opts.dates||null, w, h};
}
function sparkHover(canvas, name){
  canvas.addEventListener('mousemove', e=>{
    const g = canvas._geom; if(!g) return;
    const r = canvas.getBoundingClientRect();
    const i = Math.max(0, Math.min(g.values.length-1,
      Math.round((e.clientX-r.left-3)/(r.width-6)*(g.values.length-1))));
    const v = g.values[i];
    const when = g.dates ? g.dates[i] : `${g.values.length-1-i} bars ago`;
    showTip(`<div class="th">${esc(name)}</div>
      <div class="tr"><span>${esc(when)}</span><span>${v.toFixed(2)}</span></div>`, e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseleave', hideTip);
}

/* ---------------- full price + volume chart (drawer) ---------------- */
const KEY_LEVELS = [
  ['hi52','52w high','#e8b64c','#bd8420'],
  ['lo52','52w low','#8fd0a9','#57b57f'],
  ['sma50','50 SMA','#7dabff','#4d8dff'],
  ['sma200','200 SMA','#9aa3b8','#6a7490'],
  ['base_hi','breakout','#f478b0','#e64f95'],
];
// Slice the last `nbars` candles out of a symbol's full OHLCV for the zoom window.
function sliceOhlc(full, nbars){
  const n = full.c.length, k = Math.max(1, Math.min(n, nbars||n)), s = n - k;
  const cut = a => a.slice(s);
  return {t:cut(full.t), o:cut(full.o), h:cut(full.h), l:cut(full.l), c:cut(full.c), v:cut(full.v)};
}
function drawPriceChart(canvas, o, levels, type, showLevels){
  const dpr = devicePixelRatio||1;
  const w = canvas.clientWidth||360, h = canvas.clientHeight||180;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const n = o.c.length; if(!n) return;
  const padL=2, padR=52, padT=6, padB=6;
  // y-range from the visible candles only, so zooming in stays tight; a level
  // that falls outside the visible price band is simply not drawn.
  let lo = Math.min(...o.l), hi = Math.max(...o.h);
  const span=(hi-lo)||1;
  const lv = {};
  if(showLevels) KEY_LEVELS.forEach(([k])=>{ const v=levels[k]; if(v!=null && v>=lo && v<=hi) lv[k]=v; });
  const X = i => padL + i*(w-padL-padR)/(n-1);
  const Y = v => padT + (hi-v)*(h-padT-padB)/span;
  const bw = Math.max(1.5, (w-padL-padR)/n*0.62);
  // faint grid + right-axis labels
  ctx.font='9px ui-monospace,monospace'; ctx.textBaseline='middle';
  for(let s=0;s<=4;s++){
    const val=lo+span*s/4, y=Y(val);
    ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillStyle='#6a7490'; ctx.textAlign='left'; ctx.fillText(val.toFixed(2), w-padR+4, y);
  }
  // key-level lines
  if(showLevels){
    ctx.setLineDash([4,3]); ctx.textAlign='right';
    KEY_LEVELS.forEach(([k,label,light])=>{
      if(lv[k]==null) return;
      const y=Y(lv[k]);
      ctx.strokeStyle=light; ctx.globalAlpha=.55; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
      ctx.globalAlpha=1;
    });
    ctx.setLineDash([]);
  }
  const up = i => o.c[i] >= o.o[i];
  if(type==='line'){
    const g=ctx.createLinearGradient(0,0,0,h);
    const rising=o.c[n-1]>=o.c[0];
    g.addColorStop(0, rising?'rgba(77,141,255,.22)':'rgba(230,79,149,.22)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.moveTo(X(0),Y(o.c[0])); for(let i=0;i<n;i++) ctx.lineTo(X(i),Y(o.c[i]));
    ctx.lineTo(X(n-1),h-padB); ctx.lineTo(X(0),h-padB); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.moveTo(X(0),Y(o.c[0])); for(let i=0;i<n;i++) ctx.lineTo(X(i),Y(o.c[i]));
    ctx.strokeStyle=rising?'#4d8dff':'#e64f95'; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
  } else if(type==='candle'){
    for(let i=0;i<n;i++){
      const c=up(i)?'#4d8dff':'#e64f95', x=X(i);
      ctx.strokeStyle=c; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,Y(o.h[i])); ctx.lineTo(x,Y(o.l[i])); ctx.stroke();
      const y1=Y(o.o[i]), y2=Y(o.c[i]);
      ctx.fillStyle=c; ctx.fillRect(x-bw/2, Math.min(y1,y2), bw, Math.max(1,Math.abs(y2-y1)));
    }
  } else { // bar (OHLC)
    for(let i=0;i<n;i++){
      const c=up(i)?'#4d8dff':'#e64f95', x=X(i);
      ctx.strokeStyle=c; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(x,Y(o.h[i])); ctx.lineTo(x,Y(o.l[i]));
      ctx.moveTo(x-bw/2,Y(o.o[i])); ctx.lineTo(x,Y(o.o[i]));
      ctx.moveTo(x,Y(o.c[i])); ctx.lineTo(x+bw/2,Y(o.c[i])); ctx.stroke();
    }
  }
  canvas._chart={X,Y,n,padR,w,h,o,lv};
}
function drawVolume(canvas, o){
  const dpr=devicePixelRatio||1;
  const w=canvas.clientWidth||360, h=canvas.clientHeight||52;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  const n=o.v.length; if(!n) return;
  const padL=2,padR=52, mx=Math.max(...o.v)||1;
  const X=i=>padL+i*(w-padL-padR)/(n-1);
  const bw=Math.max(1.2,(w-padL-padR)/n*0.62);
  for(let i=0;i<n;i++){
    const bh=(o.v[i]/mx)*(h-4);
    ctx.fillStyle=(o.c[i]>=o.o[i])?'rgba(77,141,255,.55)':'rgba(230,79,149,.55)';
    ctx.fillRect(X(i)-bw/2, h-bh, bw, bh);
  }
  ctx.font='9px ui-monospace,monospace'; ctx.textBaseline='top'; ctx.textAlign='left'; ctx.fillStyle='#6a7490';
  ctx.fillText('vol '+(mx>=1e6?(mx/1e6).toFixed(1)+'M':(mx/1e3).toFixed(0)+'K'), w-padR+4, 2);
  canvas._vol={X,n,w,padR};
}
// Attach once per drawer; reads the currently drawn view from priceCv._chart.o
// so it always reflects the active zoom window without re-binding listeners.
function chartCrosshair(priceCv, volCv, name){
  function move(e){
    const c=priceCv._chart; if(!c) return;
    const o=c.o;
    const r=priceCv.getBoundingClientRect();
    const i=Math.max(0,Math.min(c.n-1, Math.round((e.clientX-r.left-2)/(r.width-2-c.padR)*(c.n-1))));
    const chg=i>0?((o.c[i]/o.c[i-1]-1)*100):0;
    showTip(`<div class="th">${esc(name)} <span style="color:var(--ink-3)">${esc(o.t[i])}</span></div>
      <div class="tr"><span>O</span><span>${o.o[i].toFixed(2)}</span></div>
      <div class="tr"><span>H</span><span>${o.h[i].toFixed(2)}</span></div>
      <div class="tr"><span>L</span><span>${o.l[i].toFixed(2)}</span></div>
      <div class="tr"><span>C</span><span>${o.c[i].toFixed(2)} (${chg>0?'+':''}${chg.toFixed(2)}%)</span></div>
      <div class="tr"><span>Vol</span><span>${o.v[i]>=1e6?(o.v[i]/1e6).toFixed(2)+'M':(o.v[i]/1e3).toFixed(0)+'K'}</span></div>`,
      e.clientX, e.clientY);
  }
  [priceCv,volCv].forEach(cv=>{ cv.addEventListener('mousemove',move); cv.addEventListener('mouseleave',hideTip); });
}

function fillTracker(id, groups){

const FDEF = {q:'', sector:'', theme:'', above50:false, noetf:false, minrs:''};
RENDER.screener = function(){
  const f = Object.assign({}, FDEF, store.get('flt', {}));
  const sectors = [...new Set(SNAP.rows.map(r=>r.sector))].sort();
  const themes = SNAP.themes.map(t=>t.name).sort();
  $('#view').innerHTML = `
  <section class="panel">
    <h2>Screener<span class="sub">${SNAP.rows.length} symbols · precomputed features · as of ${SNAP.as_of}</span></h2>
    <div class="toolbar">
      <input type="text" id="f-q" placeholder="filter symbols…" value="${esc(f.q)}">
      <select id="f-sector"><option value="">All sectors</option>${sectors.map(s=>`<option ${f.sector===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <select id="f-theme"><option value="">All themes</option>${themes.map(s=>`<option ${f.theme===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <input type="number" id="f-minrs" placeholder="min RS" min="0" max="100" value="${esc(f.minrs)}">
      <label class="ck"><input type="checkbox" id="f-above50" ${f.above50?'checked':''}> above 50 SMA</label>
      <label class="ck"><input type="checkbox" id="f-noetf" ${f.noetf?'checked':''}> hide ETFs</label>

      COLS.map(([k,l,c])=>`<th class="${c||''}" data-k="${k}">${l}<span class="arr" data-arr="${k}"></span></th>`).join('')
    }</tr></thead><tbody></tbody></table></div>
    <div class="count" id="scr-count"></div>
  </section>`;
  const sort = store.get('sort', {k:'rs', dir:-1});
  function apply(){
    const f = Object.assign({}, FDEF, store.get('flt', {}));
    let rows = SNAP.rows.filter(r=>
      (!f.q || r.sym.toUpperCase().includes(f.q.toUpperCase())) &&

      return (typeof x==='string' ? x.localeCompare(y) : x-y) * dir;
    });
    document.querySelectorAll('[data-arr]').forEach(s=>s.textContent = s.dataset.arr===k?(dir<0?' ▾':' ▴'):'');
    $('#scr tbody').innerHTML = rows.map(r=>`
      <tr data-sym="${r.sym}">
        <td class="l"><span class="sym">${r.sym}</span> <span class="sect">${esc(r.sector)}</span></td>
        <td>${fmtNum(r.close)}</td><td>${fmtPct(r.d1)}</td><td>${fmtPct(r.w1)}</td>
        <td>${fmtPct(r.m1)}</td><td>${fmtPct(r.m3)}</td><td>${fmtPct(r.m6)}</td><td>${fmtPct(r.ytd)}</td>
        <td>${fmtNum(r.rvol)}</td><td>${r.rs===null?'<span class="num flat">—</span>':`<span class="num">${r.rs.toFixed(1)}</span>`}</td>
        <td>${fmtPct(r.p52,false)}</td><td>${fmtNum(r.adr)}</td><td>${fmtNum(r.dvol,1)}</td>
        <td><span class="dots" title="above 10 / 20 / 50 / 200 SMA">${[r.a10,r.a20,r.a50,r.a200].map(x=>`<i class="${x?'on':''}"></i>`).join('')}</span></td>
        <td>${r.baseq===null?'<span class="num flat">—</span>':`<span class="num ${r.qual?'pos':''}">${r.baseq.toFixed(2)}</span>`}</td>
      </tr>`).join('');
    $('#scr-count').textContent = `${rows.length} of ${SNAP.rows.length} symbols`;
  }
  function saveFlt(){
    store.set('flt', {q:$('#f-q').value, sector:$('#f-sector').value, theme:$('#f-theme').value,
      above50:$('#f-above50').checked, noetf:$('#f-noetf').checked, minrs:$('#f-minrs').value});
    apply();
  }
  ['f-q','f-minrs'].forEach(id=>$('#'+id).addEventListener('input', saveFlt));
  ['f-sector','f-theme','f-above50','f-noetf'].forEach(id=>$('#'+id).addEventListener('change', saveFlt));
  $('#f-reset').addEventListener('click', ()=>{ store.set('flt', FDEF); RENDER.screener(); });
  $('#scr thead').addEventListener('click', e=>{
    const th = e.target.closest('th[data-k]'); if(!th) return;
    const cur = store.get('sort', sort);
    store.set('sort', {k:th.dataset.k, dir: cur.k===th.dataset.k? -cur.dir : -1});
    apply();
  });
  $('#scr tbody').addEventListener('click', e=>{
    const tr = e.target.closest('tr[data-sym]'); if(tr) openDrawer(tr.dataset.sym);
  });
  apply();
};

RENDER.themes = function(){

  $('#view').innerHTML = `
  <section class="panel" style="margin-bottom:14px">
    <h2>Theme rankings<span class="sub">score = composite percentile of six components · as of ${SNAP.as_of}</span></h2>
    <div class="twrap"><table id="thm"><thead><tr>
      <th class="l" style="cursor:default">#</th><th class="l" style="cursor:default">Theme</th>
      <th style="cursor:default">Score</th>${TF.map(([k,l])=>`<th style="cursor:default">${l}</th>`).join('')}
      <th style="cursor:default">&gt;50SMA</th><th style="cursor:default">near hi</th><th class="l" style="cursor:default">Leaders</th>
    </tr></thead><tbody>${
      SNAP.themes.map(t=>`
      <tr data-th="${esc(t.name)}"><td class="l"><span class="num">${t.rank}</span></td>

  function fillMembers(name){
    const t = SNAP.themes.find(x=>x.name===name);

    const rows = SNAP.rows.filter(r=>t.members.includes(r.sym));
    $('#thm-members').innerHTML = `<section class="panel">
      <h2>${esc(name)} — members<span class="sub">${rows.length} with data</span></h2>
      <div class="twrap"><table><thead><tr>
        <th class="l" style="cursor:default">Symbol</th><th style="cursor:default">Close</th><th style="cursor:default">Today</th>
        <th style="cursor:default">1M</th><th style="cursor:default">3M</th><th style="cursor:default">RS %ile</th>
        <th style="cursor:default">vs 52w hi</th><th class="l" style="cursor:default">3M trend</th></tr></thead><tbody>${
        rows.sort((a,b)=>(b.rs??-1)-(a.rs??-1)).map(r=>`

    document.querySelectorAll('canvas[data-mspark]').forEach(c=>{
      drawSpark(c, SNAP.rows.find(x=>x.sym===c.dataset.mspark).spark);
    });
    $('#thm-members tbody').addEventListener('click', e=>{
      const tr = e.target.closest('tr[data-sym]'); if(tr) openDrawer(tr.dataset.sym);

/* ---------------- scanner ---------------- */
RENDER.scanner = function(){
  const {leaders, approaching} = SCAN.res;
  const pct = v => v==null ? '—' : (v>0?'+':'')+v.toFixed(1)+'%';
  const pivot = c => c.bdist==null ? '—'
    : c.bdist<=0 ? `${Math.abs(c.bdist).toFixed(1)}% through`
    : `${c.bdist.toFixed(1)}% to go`;
  const leadRows = leaders.slice(0,25).map((c,i)=>`
    <tr data-sym="${c.symbol}">
      <td class="rank">${i+1}</td>
      <td><b class="sym">${esc(c.symbol)}</b><span class="lsec">${esc(c.sector||'')}</span></td>
      <td class="num">${c.close.toFixed(2)}</td>
      <td class="num ${c.d1>=0?'up':'dn'}">${pct(c.d1)}</td>
      <td class="num rs"><span class="rsbadge">${c.rs.toFixed(0)}</span></td>
      <td class="num ${c.bdist<=0?'up':''}">${pivot(c)}</td>
      <td class="num ${c.m1>=0?'up':'dn'}">${pct(c.m1)}</td>
      <td class="num ${c.m3>=0?'up':'dn'}">${pct(c.m3)}</td>
      <td class="num">${c.rvol==null?'—':c.rvol.toFixed(2)+'×'}</td>
      <td><canvas class="lspark" data-s="${c.symbol}"></canvas></td>
    </tr>`).join('');

  $('#view').innerHTML = `
  <div class="scangrid">
    <section class="panel">
      <h2>Breakout Leaders
        <span class="sub">highest-RS names at or through their pivot · ${leaders.length} found · as of ${SNAP.as_of}</span></h2>
      <div class="scanrow">
        <span class="scanhint">The market's leaders right at the breakout — top relative strength, price at or through the pivot. "Pivot" shows how far from the breakout level each is. Press <b>▶ RUN SCAN</b> to refresh over the current data.</span>
        <span class="asof" id="scanstamp"></span>
      </div>
      ${leaders.length ? `<div class="leadwrap"><table class="leadtbl">
        <thead><tr><th>#</th><th>Symbol</th><th>Price</th><th>Day</th><th>RS</th><th>Pivot</th><th>1M</th><th>3M</th><th>RVol</th><th>Trend</th></tr></thead>
        <tbody>${leadRows}</tbody></table></div>`
        : `<div class="note">No names are breaking out in the current data. Loosen nothing — this is a real read of the ${SNAP.rows.filter(r=>!r.etf).length}-name universe as of ${SNAP.as_of}.</div>`}
    </section>
    <section class="panel">
      <h2>Approaching<span class="sub">${approaching.length} nearing pivot</span></h2>
      <div class="applist">${
        approaching.slice(0,20).map(c=>`
        <div class="approw" data-sym="${c.symbol}">
          <div class="atop"><b class="sym">${esc(c.symbol)}</b><span class="rsbadge sm">${c.rs.toFixed(0)}</span></div>
          <div class="asub">${esc(c.sector||'')}</div>
          <div class="ameta"><span>${c.bdist.toFixed(1)}% to pivot</span><span class="${c.m3>=0?'up':'dn'}">${pct(c.m3)} 3M</span></div>
        </div>`).join('') || '<div class="note">Nothing set up near a pivot right now.</div>'
      }</div>
    </section>
  </div>`;
  updateScanStamp();
  // sparklines for the leader rows
  $('#view').querySelectorAll('canvas.lspark').forEach(cv=>{
    const row = SNAP.rows.find(x=>x.sym===cv.dataset.s);
    if(row) drawSpark(cv, row.spark);
  });
  $('#view').querySelectorAll('[data-sym]').forEach(el=>{
    el.style.cursor='pointer';
    el.addEventListener('click', ()=>openDrawer(el.dataset.sym));
  });
};

    for(let i=n-1;i>=0;i--){

      const vprev = i>0 ? o.v[i-1] : null;

      const vfmt = o.v[i]>=1e6?(o.v[i]/1e6).toFixed(2)+'M':(o.v[i]/1e3).toFixed(0)+'K';

    }
    $('#dvoltbl').innerHTML =
      `<thead><tr><th>Date</th><th>Close</th><th>Chg</th><th>Volume</th><th>RVol</th></tr></thead><tbody>${rows.join('')}</tbody>`;
  }
  render();
  chartCrosshair(price, vol, r.sym);
  $('#ctype').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    ctype=b.dataset.ct; store.set('ctype',ctype); render();
  });
  $('#zoomin').addEventListener('click', ()=>{ if(zi>0){ zi--; store.set('zoombars',ZOOM_STEPS[zi]); render(); }});
  $('#zoomout').addEventListener('click', ()=>{ if(zi<ZOOM_STEPS.length-1){ zi++; store.set('zoombars',ZOOM_STEPS[zi]); render(); }});
  $('#lvlck').addEventListener('change', e=>{ levels=e.target.checked; store.set('lvls',levels); render(); });
  $('#dclose').addEventListener('click', closeDrawer);
}
function closeDrawer(){ $('#drawer').classList.remove('open'); }
addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

/* ---------------- RUN SCAN (client-side, over embedded data) ---------------- */
// Recomputes the SAR composite from the embedded per-symbol features using the
// brain's own component weights — no network, no credits. Data itself refreshes
// only when the terminal is rebuilt (ask Claude, or the manual rebuild step).
const sectorScore = {};
SNAP.sectors.forEach(s=>{ s.members.forEach(m=>{ sectorScore[m]=s.score; }); });
const themeScore = {};
SNAP.themes.forEach(t=>{ t.members.forEach(m=>{ themeScore[m]=Math.max(themeScore[m]||0, t.score); }); });
// Scans the whole embedded universe and splits it into breakout leaders (strong
// RS names at or through their pivot) and approaching setups (qualifying bases
// nearing the pivot). Ranked so the leading breakouts sit on top.
function computeScan(){
  const leaders=[], approaching=[];
  for(const r of SNAP.rows){
    if(r.etf || r.bdist==null) continue;
    const rs = r.rs==null?0:r.rs;
    const row = {symbol:r.sym, sector:r.sector, close:r.close, d1:r.d1,
                 rs, m1:r.m1, m3:r.m3, bdist:r.bdist, rvol:r.rvol, baseq:r.baseq,
                 p52:r.p52, spark:r.spark};
    // Leader breakout: at/through the pivot, top-decile RS, still rising.
    if(r.bdist<=1 && rs>=85 && (r.m1==null||r.m1>-5)){
      row.lead = rs + Math.max(0,(r.m1||0))*0.5 - Math.max(0,r.bdist)*2;  // rank key
      leaders.push(row);
    } else if(r.qual && rs>=70 && r.bdist>1 && r.bdist<=8){
      approaching.push(row);
    }
  }
  leaders.sort((a,b)=>b.lead-a.lead);
  approaching.sort((a,b)=>a.bdist-b.bdist);   // closest to the pivot first
  return {leaders, approaching};
}
let SCAN = {ran:null, res:null};
SCAN.res = computeScan();   // populate on load so the Scanner is ready without a click
function runScan(){
  const btn=$('#runscan'); btn.classList.add('busy');
  setTimeout(()=>{
    SCAN.res = computeScan();
    SCAN.ran = new Date();
    store.set('lastscan', SCAN.ran.toISOString());
    btn.classList.remove('busy');
    toast(`Scan complete · <b>${SCAN.res.leaders.length}</b> breakout leaders · ${SCAN.res.approaching.length} approaching`);
    if((location.hash.replace(/^#\//,'')||'overview')==='scanner') RENDER.scanner();
    updateScanStamp();
  }, 450);
}
function updateScanStamp(){
  const el=$('#scanstamp'); if(!el) return;
  const t = SCAN.ran || (store.get('lastscan')&&new Date(store.get('lastscan')));
  el.textContent = t ? 'last scan '+new Date(t).toLocaleTimeString() : 'not run this session';
}
let toastTimer;
function toast(html){
  let el=$('#toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.innerHTML=html; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 2600);
}
$('#runscan').addEventListener('click', runScan);

route();
</script>
